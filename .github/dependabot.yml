version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "Npgsql.*", "System.*"]
      testing:
        patterns: ["xunit*", "NSubstitute", "coverlet.*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/src/ModApi.Api"
    schedule:
      interval: weekly
