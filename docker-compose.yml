# Local development stack.
#   docker compose up --build                      -> API on http://localhost:8080 backed by PostgreSQL
#   docker compose --profile sqlserver up --build  -> also starts SQL Server + a second API on http://localhost:8081
name: modapi

services:
  api:
    build:
      context: .
      dockerfile: src/ModApi.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: PostgreSql
      Database__InitializationStrategy: EnsureCreated
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=modapi;Username=modapi;Password=modapi_dev_password
      Swagger__Enabled: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modapi
      POSTGRES_USER: modapi
      POSTGRES_PASSWORD: modapi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modapi -d modapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-sqlserver:
    profiles: ["sqlserver"]
    build:
      context: .
      dockerfile: src/ModApi.Api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      Database__InitializationStrategy: EnsureCreated
      ConnectionStrings__Default: Server=sqlserver,1433;Database=modapi;User Id=sa;Password=ModApi_dev_Passw0rd;TrustServerCertificate=True;Encrypt=False
      Swagger__Enabled: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ModApi_dev_Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ModApi_dev_Passw0rd -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  postgres-data:
  sqlserver-data:
